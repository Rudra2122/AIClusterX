apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: aiclusterx
  labels: { app: api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: aiclusterx-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: aiclusterx-config }
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: aiclusterx-secrets, key: OPENAI_API_KEY }
          resources:
            requests: { cpu: "150m", memory: "256Mi" }
            limits: { cpu: "750m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: aiclusterx
spec:
  selector: { app: api }
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
