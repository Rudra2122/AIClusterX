apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: aiclusterx
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiclusterx-prometheus
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiclusterx-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: aiclusterx
roleRef:
  kind: ClusterRole
  name: aiclusterx-prometheus
  apiGroup: rbac.authorization.k8s.io
