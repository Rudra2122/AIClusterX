# Copy this file to 02-secret.yaml and fill in a real key, OR just run:
#
#   kubectl create secret generic aiclusterx-secrets \
#     --namespace aiclusterx \
#     --from-literal=OPENAI_API_KEY=sk-your-key-here
#
# Only the /agent/run (LangGraph) and /agent/adk (Google ADK) routes need a real
# OpenAI key. The core cluster (/submit, /status, /metrics, scheduler, workers,
# Prometheus, Grafana, HPA) works fine with a placeholder value — the agent
# modules build their LLM clients lazily / don't validate the key at import time.
#
# Never commit 02-secret.yaml with a real key in it (it's already gitignored below).
apiVersion: v1
kind: Secret
metadata:
  name: aiclusterx-secrets
  namespace: aiclusterx
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-placeholder-replace-me"
